<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Lista de Perguntas Múltiplas</title>
</head>
<body>

    <h2>Lista de Perguntas Múltiplas</h2>

    <a href="index.html">Voltar ao Menu</a>
    <br><br>

    <a href="cadastroPergMult.html">+ Cadastrar nova pergunta múltipla</a>
    <br><br>

    <table border="1">
        <thead>
            <tr>
                <th>ID</th>
                <th>Pergunta</th>
                <th>A</th>
                <th>B</th>
                <th>C</th>
                <th>D</th>
                <th>Correta</th>
                <th>Ações</th>
            </tr>
        </thead>

        <tbody id="tabela"></tbody>
    </table>

    <script>
        async function carregarPerguntasMultiplas() {
            try {
                const res = await fetch("api/listarPergMult.php");

                if (!res.ok) {
                    throw new Error("Erro HTTP: " + res.status);
                }

                const dados = await res.json();

                const tabela = document.getElementById("tabela");
                tabela.innerHTML = "";

                dados.forEach(p => {
                    tabela.innerHTML += `
                        <tr>
                            <td>${p.id}</td>
                            <td>${p.pergunta}</td>
                            <td>${p.a}</td>
                            <td>${p.b}</td>
                            <td>${p.c}</td>
                            <td>${p.d}</td>
                            <td>${p.correta}</td>
                            <td>
                                <button onclick="editarPerguntaMultipla(${p.id})">Editar</button>
                                <button onclick="excluirPerguntaMultipla(${p.id})">Excluir</button>
                            </td>
                        </tr>
                    `;
                });

            } catch (erro) {
                alert("Erro ao carregar perguntas múltiplas.");
                console.error(erro);
            }
        }

        function editarPerguntaMultipla(id) {
            window.location.href = "editarMult.html?id=" + id;
        }

        async function excluirPerguntaMultipla(id) {
            const confirmar = confirm("Tem certeza que deseja excluir esta pergunta múltipla?");

            if (!confirmar) {
                return;
            }

            try {
                const res = await fetch("api/excluirPergMult.php?id=" + id);
                const resposta = await res.text();

                alert(resposta);
                carregarPerguntasMultiplas();

            } catch (erro) {
                alert("Erro ao excluir pergunta múltipla.");
                console.error(erro);
            }
        }

        carregarPerguntasMultiplas();
    </script>

</body>
</html>
