<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Cadastrar de Usuario</title>
</head>
<body>
    <h2>Entre com um usuario</h2>
    <form action="salvarUsuario.php" method="POST">
        <label>Nome:</label><br>
        <input type="text" name="nome" required><br><br>

        <label>cpf:</label><br>
        <input type="text" name="CPF" required><br><br>

        <button type="submit">Salvar Usuario</button>
    </form>
    <script src="validacoes.js"></script>
</body>
</html>

<script>
    document.querySelector('form[action="salvarUsuario.php"]').addEventListener('submit', function(e) {
    const cpf = document.getElementsByName('CPF')[0].value.replace(/\D/g, ''); 
    const nome = document.getElementsByName('nome')[0].value;

    if (nome.length < 3) {
        alert("Por favor, insira um nome completo.");
        e.preventDefault();
    } else if (cpf.length !== 11) {
        alert("O CPF deve conter 11 dígitos numéricos.");
        e.preventDefault();
    }
});
</script>
