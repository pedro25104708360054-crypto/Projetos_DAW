<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Cadastrar Pergunta</title>
</head>
<body>
    <h2>Novo Cadastro de pergunta</h2>
    <form action="salvarPerg.php" method="POST">
        <label>ID unica:</label><br>
        <input type="text" name="IDunico" required><br><br>

        <label>Pergunta:</label><br>
        <input type="text" name="PerguntaUnica" required><br><br>

        <label>Resposta:</label><br>
        <input type="text" name="Resposta" ><br><br>

        <button type="submit">Salvar Criação</button>
        <a href="ListarPerg.php">Voltar para lista</a>
    </form>
    <script src="validacoes.js"></script>
</body>
</html>

<script>
    document.querySelector('form[action="salvarPerg.php"]').addEventListener('submit', function(e) {
    const idUnico = document.getElementsByName('IDunico')[0].value;
    const resposta = document.getElementsByName('Resposta')[0].value;

    if (isNaN(idUnico) || idUnico.trim() === "") {
        alert("O ID Único deve ser um número válido.");
        e.preventDefault(); 
    } else if (resposta.trim() === "") {
        alert("A resposta não pode ficar vazia.");
        e.preventDefault();
    }
});
</script>
