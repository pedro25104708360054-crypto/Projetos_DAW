<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clientes</title>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="admin-body">

<aside class="sidebar">
    <h1>Ardone</h1>
    <a href="admin_dashboard.html">Início</a>
    <a href="admin_clientes.html">Clientes</a>
    <a href="admin_funcionarios.html">Funcionários</a>
    <a href="admin_servicos.html">Serviços</a>
    <a href="admin_agendamentos.html">Agendamentos</a>
    <a href="admin_pagamentos.html">Pagamentos</a>
    <a href="#" id="sair">Sair</a>
</aside>

    <main class="admin-main">
        <header class="admin-top">
            <span>Clientes</span>
            <strong id="nomeAdmin">Administrador</strong>
        </header>
        <div id="mensagem"></div>

        <section class="panel form-panel">
            <h2>Cliente</h2>
            <form id="formCadastro" class="form-grid">
                <input type="hidden" name="tabela" value="clientes">
                <input type="hidden" name="id" id="id">

                <label>Nome</label>
                <input name="nome" id="nome" required>

                <label>E-mail</label>
                <input type="email" name="email" id="email" required>

                <label>Telefone</label>
                <input name="telefone" id="telefone" required>

                <label>Observação</label>
                <textarea name="observacao" id="observacao"></textarea>

                <div class="form-actions">
                    <button type="button" class="btn secondary" id="limpar">Limpar</button>
                    <button class="btn primary">Salvar</button>
                </div>
            </form>
        </section>

        <section class="panel">
            <h2>Lista</h2>
            <table>
                <thead>
                    <tr>
                        <th>Nome</th>
                        <th>E-mail</th>
                        <th>Telefone</th>
                        <th>Ações</th>
                    </tr>
                </thead>
                <tbody id="tabela"></tbody>
            </table>
        </section>

    </main>

    <script src="assets/js/admin_clientes.js"></script>
</body>
</html>
