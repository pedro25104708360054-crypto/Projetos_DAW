<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Início</title>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="admin-body">

<aside class="sidebar">
    <h1>Ardone</h1>
    <a href="admin_dashboard.html">Início</a>
    <a href="admin_clientes.html">Clientes</a>
    <a href="admin_funcionarios.html">Funcionários</a>
    <a href="admin_servicos.html">Serviços</a>
    <a href="admin_agendamentos.html">Agendamentos</a>
    <a href="admin_pagamentos.html">Pagamentos</a>
    <a href="#" id="sair">Sair</a>
</aside>

    <main class="admin-main">
        <header class="admin-top">
            <span>Início</span>
            <strong id="nomeAdmin">Administrador</strong>
        </header>
        <div id="mensagem"></div>

        <section class="stats">
            <article><strong id="totalClientes">0</strong><span>Clientes</span></article>
            <article><strong id="totalFuncionarios">0</strong><span>Funcionários</span></article>
            <article><strong id="totalServicos">0</strong><span>Serviços</span></article>
            <article><strong id="totalAgendamentos">0</strong><span>Agendamentos</span></article>
            <article><strong id="totalPagamentos">0</strong><span>Pagamentos</span></article>
        </section>

        

        <section class="panel">
            <h2>Agendamentos recentes</h2>
            <table>
                <thead>
                    <tr>
                        <th>Cliente</th>
                        <th>Funcionário</th>
                        <th>Serviço</th>
                        <th>Data</th>
                        <th>Hora</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody id="tabelaRecentes"></tbody>
            </table>
        </section>

    </main>

    <script src="assets/js/admin_dashboard.js"></script>
